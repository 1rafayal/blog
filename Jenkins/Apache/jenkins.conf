<VirtualHost *:80>
ServerName 10.0.4.61

LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module /usr/lib/apache2/modules/mod_proxy_wstunnel.so
LoadModule rewrite_module /usr/lib/apache2/modules/rewrite.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so

ProxyRequests		Off
AllowEncodedSlashes	NoDecode
ProxyPreserveHost	On

<Location />
RewriteEngine	on
RewriteCond	%{HTTP:Upgrade} websocket [NC]
RewriteCond	%{HTTP:Connection} upgrade [NC]
RewriteRule	^/?(.*) "ws://10.0.4.61:8080/$1" [P,L]

ProxyPass 		http://10.0.4.61:8080/ nocanon keepalive=on
ProxyPassReverse	http://10.0.4.61:8080/

RequestHeader	set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
RequestHeader	set X-Forwarded-Port "expr=%{SERVER_PORT}"
</Location>

<Proxy *>
	Require all granted
</Proxy>
ErrorLog	${APACHE_LOG_DIR}/jenkins_error.log
CustomLog	${APACHE_LOG_DIR}/jenkins_access.log combined
</VirtualHost>
